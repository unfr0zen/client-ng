[package]
name = "client-ng"
version = "0.1.0"
edition = "2021"
description = "The thermostat's own UI: a GLES2 renderer whose look comes from Lua skins"

[dependencies]
femtovg = { version = "0.27", default-features = false, features = ["textlayout", "image-loading"] }
# femtovg decodes images through this; without its formats it decodes none.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9"
# The software painter, for units without a GPU (the gen 2).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
glow = "0.18"
libc = "0.2"
libloading = "0.9"
mlua = { version = "0.12", features = ["luajit", "vendored"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The desktop build's window (--features desktop), round and see-through
# round the unit: OpenGL keeps the pixels' alpha.
winit = { version = "0.30", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }

# The desktop build's hold on macOS's App Nap, which throttles a window
# behind others (the version winit already uses).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.2", optional = true, features = ["NSProcessInfo", "NSString"] }

[features]
# Runs on a Linux or macOS host in a window, in place of the unit's panel,
# ring and button, with the backplate simulated (README.md, "On the desktop").
desktop = ["dep:winit", "dep:glutin", "dep:glutin-winit", "dep:objc2-foundation"]
